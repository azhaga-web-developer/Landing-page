<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancer Awareness & Support</title>
  <meta name="description" content="Cancer Awareness & Support - Empowering lives through awareness and compassion.">
  <meta name="keywords" content="Cancer Awareness, Support, Health, Community">
  <meta name="author" content="Maaran">
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Cancer Awareness & Support</h1>
    <p>Empowering lives through awareness and compassion.</p>
    <img src="banner-img.jpg" alt="Cancer Awareness Banner" />
  </header>

  <section class="contact-form">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Name" required />
      <input type="email" placeholder="Email" required />
      <textarea placeholder="Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <section class="quotes">
    <h2>Inspirational Quote</h2>
    <p id="quote">Loading...</p>
    <button onclick="fetchQuote()">Refresh Quote</button>
  </section>

  <footer>
    <p>&copy; 2025 Cancer Awareness Initiative</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
